name: Build Study Clock APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No Android project ZIP found."
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          rm -rf project extract
          mkdir -p project extract
          unzip -q "$ZIP" -d extract
          ROOT="$(find extract -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find extract -maxdepth 5 -type f | sort | head -150
            exit 1
          fi
          cp -a "$ROOT/." project/
          test -f project/settings.gradle
          test -f project/app/build.gradle
          echo "Android project found at: $ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-clock-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
