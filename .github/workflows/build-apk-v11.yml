name: Build Study Clock APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Verify Android project
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          test -f settings.gradle
          test -f app/build.gradle
          find app/src/main -maxdepth 3 -type f | sort | head -80

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print
          test -n "$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-clock-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
